services:
  postgres-airflow:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: airline_datascientist_2024

      # Configuration SMTP pour les alertes
      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_STARTTLS: 'True'
      AIRFLOW__SMTP__SMTP_SSL: 'False'
      AIRFLOW__SMTP__SMTP_PORT: '587'
      AIRFLOW__SMTP__SMTP_USER: emperatornang@gmail.com
      AIRFLOW__SMTP__SMTP_PASSWORD: eyzb qxdt lstu sadb
      AIRFLOW__SMTP__SMTP_MAIL_FROM: emperatornang@gmail.com

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project_root
      - ./models:/opt/airflow/models
    ports:
      - "8081:8080"
    command: >
      bash -c "airflow db upgrade &&
               airflow users create --username airflow --password airflow --firstname Air --lastname Flow --role Admin --email airflow@example.com &&
               exec airflow webserver"

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: airline_datascientist_2024

      # SMTP (pareil que webserver)
      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_STARTTLS: 'True'
      AIRFLOW__SMTP__SMTP_SSL: 'False'
      AIRFLOW__SMTP__SMTP_PORT: '587'
      AIRFLOW__SMTP__SMTP_USER: emperatornang@gmail.com
      AIRFLOW__SMTP__SMTP_PASSWORD: eyzb qxdt lstu sadb
      AIRFLOW__SMTP__SMTP_MAIL_FROM: emperatornang@gmail.com

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project_root
      - ./models:/opt/airflow/models
    command: >
      bash -c "airflow db upgrade && exec airflow scheduler"

volumes:
  postgres-db-volume:
